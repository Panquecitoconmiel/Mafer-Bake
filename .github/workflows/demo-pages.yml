# Publica la demostración de diseño (modo vitrina, sin base de datos) en GitHub Pages.
# Se ejecuta en cada push a main o manualmente desde la pestaña Actions.
name: Demostración en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Solo se instala el frontend: la demostración no necesita servidor ni base de datos.
      - run: pnpm install --frozen-lockfile --filter ./client
      - run: pnpm --filter ./client build:demo
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
